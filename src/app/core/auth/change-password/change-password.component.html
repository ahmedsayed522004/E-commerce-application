<section class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-green-600">Change Password</h2>

      <p class="text-gray-500 mt-2">Update your account password</p>
    </div>

    <form (ngSubmit)="submitChangePasswordForm()">
      <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-gray-700"> Current Password </label>

        <input
          [(ngModel)]="currentPassword"
          name="currentPassword"
          type="password"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"
          placeholder="Enter current password"
        />
      </div>

      <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-gray-700"> New Password </label>

        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"
          placeholder="Enter new password"
        />
      </div>

      <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-gray-700"> Confirm Password </label>

        <input
          [(ngModel)]="rePassword"
          name="rePassword"
          type="password"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"
          placeholder="Confirm new password"
        />
      </div>

      @if (errorMessage) {
        <div class="mb-4 rounded-lg bg-red-100 px-4 py-3 text-red-700">
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="mb-4 rounded-lg bg-green-100 px-4 py-3 text-green-700">
          {{ successMessage }}
        </div>
      }

      <button
        type="submit"
        class="w-full bg-green-600 cursor-pointer text-white py-3 rounded-lg font-medium hover:bg-green-700 transition"
      >
        Change Password
      </button>
    </form>
  </div>
</section>
