<section class="py-10 bg-gray-100 min-h-screen">
  <div class="container mx-auto px-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Cart -->
      <div class="lg:col-span-8">
        <!-- Header -->
        <div class="mb-6 flex items-center justify-between">
          <h2 class="text-2xl font-bold text-gray-800">Cart ({{ whishListData().length }})</h2>
        </div>

        <!-- Items -->
        <div class="space-y-5">
          @for (item of whishListData(); track item._id) {
            <div
              class="bg-white rounded-xl shadow-sm hover:shadow-lg transition p-5 flex items-center justify-between"
            >
              <div class="flex items-center gap-6">
                <img
                  [src]="item.imageCover"
                  class="w-32 h-32 object-cover rounded-xl border shadow-sm"
                />

                <div class="flex flex-col gap-2 max-w-md">
                  <div class="flex items-center gap-2 text-xs">
                    <span class="text-green-600 font-semibold">
                      {{ item.category.name }}
                    </span>
                    <span class="bg-gray-800 text-white px-2 py-0.5 rounded">
                      {{ item.brand.name }}
                    </span>
                  </div>

                  <h3 class="text-lg font-semibold text-gray-800 line-clamp-2">
                    {{ item.title }}
                  </h3>

                  <!-- Rating -->
                  <div class="flex items-center gap-1 text-sm">
                    <span class="text-gray-700 text-lg font-semibold border-gray-300 px-2 py-0.5">
                      ratings:
                      {{ item.ratingsAverage }}
                    </span>
                    <i class="fas fa-star text-yellow-500"></i>
                  </div>
                </div>
              </div>

              <!-- Right -->
              <div class="flex flex-col items-end gap-4">
                <!-- Price -->
                <span class="text-xl font-bold text-green-600">
                  {{ item.price | currency: 'GBP' }}
                </span>

                <button
                  (click)="removeProductItemFromWhishlist(item._id)"
                  class="flex items-center gap-2 cursor-pointer bg-red-50 text-red-600 px-4 py-2 rounded-lg hover:bg-red-600 hover:text-white transition duration-200"
                >
                  <i class="fas fa-trash"></i>
                  Remove
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
