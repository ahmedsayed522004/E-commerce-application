<div
  class="relative group/parent bg-white rounded-2xl shadow-md hover:shadow-xl transition duration-300 overflow-hidden p-4 h-full"
>
  <div [routerLink]="['/details', cardProduct.slug, cardProduct._id]" class="cursor-pointer mb-14">
    <div class="overflow-hidden rounded-xl">
      <img
        [src]="cardProduct.imageCover"
        [alt]="cardProduct.title.split(' ', 2).join(' ')"
        class="w-full md:h-48 object-cover md:group-hover:scale-110 transition duration-300"
      />
    </div>

    <div class="p-4">
      <h3 class="text-xs text-green-600 font-semibold mb-1">
        {{ cardProduct.category.name }}
      </h3>

      <h4 class="text-sm md:text-base font-medium line-clamp-2 mb-2">
        {{ cardProduct.title.split(' ', 2).join(' ') }}
      </h4>

      <div class="flex items-center justify-between">
        <span class="font-semibold text-gray-800"> {{ cardProduct.price }} EGP </span>

        <span class="flex items-center gap-1 text-sm text-yellow-500">
          <i class="fas fa-star"></i>
          {{ cardProduct.ratingsAverage }}
        </span>
      </div>
    </div>
  </div>

  <!-- Mobile -->
  <div class="flex flex-col gap-2 mt-4 md:hidden">
    <button
      class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition cursor-pointer"
      (click)="addProductItemToCart(cardProduct._id)"
    >
      Add To Cart
    </button>

    <button
      class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition cursor-pointer"
      (click)="addProductItemToWhishlist(cardProduct._id)"
    >
      Add To Wishlist
    </button>
  </div>

  <!-- Desktop -->
  <div class="hidden md:block">
    <button
      class="absolute bottom-0 left-0 right-0 w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition duration-300 cursor-pointer translate-y-[150%] group-hover/parent:translate-y-0"
      (click)="addProductItemToCart(cardProduct._id)"
    >
      Add To Cart
    </button>

    <button
      class="absolute bottom-10 left-0 right-0 w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition duration-300 cursor-pointer translate-y-[210%] group-hover/parent:translate-y-0 mb-1"
      (click)="addProductItemToWhishlist(cardProduct._id)"
    >
      Add To Wishlist
    </button>
  </div>
</div>
